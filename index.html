    <!-- Safe serialization guard for AI Studio iframe inspection & React Fiber circular references -->
    <script>
      (function() {
        var rawStringify = JSON.stringify;
        if (typeof rawStringify === 'function') {
          JSON.stringify = function(value, replacer, space) {
            var seen = new WeakSet();
            return rawStringify(
              value,
              function(key, val) {
                if (val !== null && typeof val === 'object') {
                  if (typeof Node !== 'undefined' && val instanceof Node) {
                    return '[' + (val.nodeName || 'DOMNode') + ']';
                  }
                  if (val.nodeType || val === window) {
                    return '[' + (val.tagName || 'Element') + ']';
                  }
                  if (seen.has(val)) {
                    return '[Circular]';
                  }
                  seen.add(val);
                }
                return typeof replacer === 'function' ? replacer.call(this, key, val) : val;
              },
              space
            );
          };
        }

        if (typeof window !== 'undefined' && window.console) {
          var sanitize = function(item) {
            if (item && typeof item === 'object') {
              if (typeof Node !== 'undefined' && item instanceof Node) {
                return '<' + (item.nodeName ? item.nodeName.toLowerCase() : 'element') + (item.id ? '#' + item.id : '') + '>';
              }
            }
            return item;
          };

          ['log', 'warn', 'error', 'debug', 'info'].forEach(function(method) {
            var original = window.console[method];
            if (typeof original === 'function') {
              window.console[method] = function() {
                var cleanArgs = [];
                for (var i = 0; i < arguments.length; i++) {
                  cleanArgs.push(sanitize(arguments[i]));
                }
                return original.apply(window.console, cleanArgs);
              };
            }
          });
        }
      })();
    </script>
